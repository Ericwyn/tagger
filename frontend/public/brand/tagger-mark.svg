<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Tagger</title>
  <desc id="desc">A solid vinyl record with a white center and a warm red metadata label.</desc>
  <style>
    .ink { fill: #191a17; }
    .paper { fill: #fffefa; }
    .accent { fill: #e84b2c; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f0eee5; }
      .paper { fill: #181916; }
      .accent { fill: #ff6748; }
    }
  </style>
  <circle class="ink" cx="32" cy="32" r="26"/>
  <circle class="paper" cx="32" cy="32" r="10"/>
  <rect class="accent" x="22" y="12.5" width="20" height="6" rx="3"/>
</svg>
